# ULP split: 6 columns, outer 4 have an extra row below the bottom row (4,4,4,4,3,3) + 3 thumbs per half
# Switches: Cherry MX ULP, through-hole double-sided (cherry_ulp footprint)
# Spacing: choc (18 x 17 mm)
# Controller: Seeed XIAO nRF52840, surface mounted (ZMK board `xiao_ble//zmk`)
#   battery via Molex Pico-EZmate -> power switch -> XIAO BAT+ pad (charges over USB-C when switched on)
#   reset: use the XIAO's onboard button
#
# Matrix (col2row, identical on both halves, ZMK `&xiao_d N`): 5 x 5 = 25 keys on D0..D9,
# trackpad pads (both halves, firmware uses the right one): SDA = NFC1 (P0.09), SCL = NFC2 (P0.10), DR = D10,
# 4.7k pull-ups on SDA/SCL
#   cols  outer=D0 pinky=D1 ring=D2 middle=D3 index=D4 (the inner column and the thumbs borrow these)
#   rows  top=D7 home=D8 bottom=D9 lower=D6 (outer 4 columns + near thumb) extra=D5 (inner column, mid/far thumb)
#   inner top=D3/D5 home=D4/D5 bottom=D2/D5, thumbs near=D4/D6 mid=D1/D5 far=D0/D5 (col/row)

meta:
  engine: 4.2.1
  name: ulp-split
  author: simon

units:
  kx: cx
  ky: cy
  $default_spread: cx
  $default_padding: cy
  $default_width: cx - 0.5
  $default_height: cy - 0.5

points:
  mirror:
    ref: matrix_inner_home
    distance: 4kx
  zones:
    matrix:
      columns:
        outer:
          key.column_net: D0
        pinky:
          key.column_net: D1
        ring:
          key.stagger: 0.5ky
          key.column_net: D2
        middle:
          key.stagger: 0.25ky
          key.column_net: D3
        index:
          key.stagger: -0.25ky
          key.column_net: D4
          rows.lower.skip: true
        inner:
          key.stagger: -0.15ky
          rows.lower.skip: true
          # no column pin of its own: on the extra row D5, columns from the middle/index/ring nets
          rows.top: {column_net: D3, row_net: D5}
          rows.home: {column_net: D4, row_net: D5}
          rows.bottom: {column_net: D2, row_net: D5}
      rows:
        # rows are listed bottom to top; lower only exists on the outer 4 columns
        lower.row_net: D6
        bottom.row_net: D9
        home.row_net: D8
        top.row_net: D7
    thumb:
      anchor:
        ref: matrix_index_bottom
        shift: [0.25kx, -ky - 3.5]
        rotate: -6
      columns:
        near:
          key.column_net: D4
          # free slot of the lower row (index column has no lower key)
          rows.cluster.row_net: D6
        mid:
          key.splay: -8
          key.origin: [-0.5kx, -0.5ky]
          key.column_net: D1
        far:
          key.splay: -8
          key.origin: [-0.5kx, -0.5ky]
          key.column_net: D0
      rows:
        cluster.row_net: D5

outlines:
  _keys:
    - what: rectangle
      where: /^(matrix|thumb)_/
      size: [kx, ky]
  # controller column; its bottom edge (inner_top - 17.7 after the 2 mm expand) ends at the battery connector's plug,
  # the notch below it holds the battery
  _mcu:
    - what: rectangle
      where:
        ref: matrix_inner_top
        shift: [kx + 4, 2.65]
      size: [22, 36.7]
  # two small rectangular patches for the slivers next to the thumb cluster:
  # square off the corner below the middle column's lowest key, and run the inner column's
  # outer edge straight down to the thumbs
  _fill:
    - what: rectangle
      where:
        ref: matrix_middle_lower
        shift: [11.25, -1.875]
      size: [5.5, 13.25]
    - what: rectangle
      where:
        ref: matrix_inner_bottom
        shift: [7, -11.2]
      size: [4, 6.5]
  # small tabs on the outer side for visible M2 screws (screw heads clear of the keycaps), see mounts below
  _tabs:
    - what: circle
      where:
        ref: matrix_outer_lower
        shift: [-11, 42.5]
      radius: 2.6
    - what: circle
      where:
        ref: matrix_outer_lower
        shift: [-11, 8.5]
      radius: 2.6
    - what: circle
      where:
        ref: matrix_outer_lower
        shift: [9, 61.5]
      radius: 2.6
    - what: circle
      where:
        ref: matrix_outer_lower
        shift: [9, -10.5]
      radius: 2.6
  _tabs_r:
    - $extends: outlines._tabs.0
      asym: clone
    - $extends: outlines._tabs.1
      asym: clone
    - $extends: outlines._tabs.2
      asym: clone
    - $extends: outlines._tabs.3
      asym: clone
  _raw:
    - _keys
    - _mcu
    - _fill
    - _tabs
  left:
    - what: outline
      name: _raw
      expand: 2
      joints: round
  _keys_r:
    - $extends: outlines._keys.0
      asym: clone
  _mcu_r:
    - $extends: outlines._mcu.0
      asym: clone
  _fill_r:
    - $extends: outlines._fill.0
      asym: clone
    - $extends: outlines._fill.1
      asym: clone
  _raw_r:
    - _keys_r
    - _mcu_r
    - _fill_r
    - _tabs_r
  right:
    - what: outline
      name: _raw_r
      expand: 2
      joints: round
  # board outline shrunk by the edge clearance; route.py hands this to Freerouting instead of the real edge
  left_route:
    - what: outline
      name: left
      expand: -0.7
  right_route:
    - what: outline
      name: right
      expand: -0.7
  # full preview (both halves)
  preview:
    - what: rectangle
      where: true
      size: [kx - 0.5, ky - 0.5]
    - what: rectangle
      where:
        ref: matrix_inner_top
        shift: [kx + 4, 12.5]
      asym: both
      size: [17.8, 21]

pcbs:
  left:
    outlines:
      edge:
        outline: left
      route_edge:
        outline: left_route
        layer: Eco1.User
    footprints:
      switch:
        what: cherry_ulp
        where: /^(matrix|thumb)_/
        params:
          from: "{{column_net}}"
          to: "{{colrow}}"
          keycaps: true
      # backup: SOD-123 (1N4148W) pads on the back under each switch, in parallel with the top SOD-323.
      # Fit ONE diode per key, either the top SOD-323 or this one.
      diode_back:
        what: diode_sod123_back
        where: /^(matrix|thumb)_/
        params:
          designator: DB
          from: "{{colrow}}"
          to: "{{row_net}}"
        # under the switch, clear of its pads
        adjust.shift: [0, 5.5]
      # SOD-323 diodes (1N4148WS) on top, outside all keycaps, one per key: generated by place_diodes.py
      # >>> diodes (generated, do not edit)
      diode_far_cluster:
        what: diode_sod323
        where:
          ref: thumb_far_cluster
          orient: 22
          shift: [-23.40, 17.71]
          rotate: 0
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          label: TF
          label_side: 1
      diode_index_bottom:
        what: diode_sod323
        where:
          ref: matrix_index_bottom
          orient: -0
          shift: [-1.60, -9.27]
          rotate: 0
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          label: IB
          label_side: -1
      diode_index_home:
        what: diode_sod323
        where:
          ref: matrix_index_home
          orient: -0
          shift: [27.88, 3.95]
          rotate: 90
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          label: IH
          label_side: -1
      diode_index_top:
        what: diode_sod323
        where:
          ref: matrix_index_top
          orient: -0
          shift: [1.40, 9.23]
          rotate: 0
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          label: IT
          label_side: 1
      diode_inner_bottom:
        what: diode_sod323
        where:
          ref: matrix_inner_bottom
          orient: -0
          shift: [-4.10, -9.47]
          rotate: 0
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          label: NB
          label_side: 1
      diode_inner_home:
        what: diode_sod323
        where:
          ref: matrix_inner_home
          orient: -0
          shift: [9.88, 2.25]
          rotate: 90
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          label: NH
          label_side: -1
      diode_inner_top:
        what: diode_sod323
        where:
          ref: matrix_inner_top
          orient: -0
          shift: [9.88, -2.00]
          rotate: 90
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          label: NT
          label_side: 1
      diode_mid_cluster:
        what: diode_sod323
        where:
          ref: thumb_mid_cluster
          orient: 14
          shift: [-30.45, 4.80]
          rotate: 0
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          label: TM
          label_side: -1
      diode_middle_bottom:
        what: diode_sod323
        where:
          ref: matrix_middle_bottom
          orient: -0
          shift: [10.90, -18.77]
          rotate: 0
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          label: MB
          label_side: 1
      diode_middle_home:
        what: diode_sod323
        where:
          ref: matrix_middle_home
          orient: -0
          shift: [10.90, 21.98]
          rotate: 0
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          label: MH
          label_side: 1
      diode_middle_lower:
        what: diode_sod323
        where:
          ref: matrix_middle_lower
          orient: -0
          shift: [1.40, -9.27]
          rotate: 0
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          label: ML
          label_side: -1
      diode_middle_top:
        what: diode_sod323
        where:
          ref: matrix_middle_top
          orient: -0
          shift: [0.90, 9.23]
          rotate: 0
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          label: MT
          label_side: 1
      diode_near_cluster:
        what: diode_sod323
        where:
          ref: thumb_near_cluster
          orient: 6
          shift: [-11.60, -0.77]
          rotate: 0
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          label: TN
          label_side: -1
      diode_outer_bottom:
        what: diode_sod323
        where:
          ref: matrix_outer_bottom
          orient: -0
          shift: [-2.85, -26.27]
          rotate: 0
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          label: OB
          label_side: -1
      diode_outer_home:
        what: diode_sod323
        where:
          ref: matrix_outer_home
          orient: -0
          shift: [-3.35, 26.23]
          rotate: 0
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          label: OH
          label_side: 1
      diode_outer_lower:
        what: diode_sod323
        where:
          ref: matrix_outer_lower
          orient: -0
          shift: [1.40, -9.27]
          rotate: 0
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          label: OL
          label_side: -1
      diode_outer_top:
        what: diode_sod323
        where:
          ref: matrix_outer_top
          orient: -0
          shift: [0.90, 9.23]
          rotate: 0
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          label: OT
          label_side: 1
      diode_pinky_bottom:
        what: diode_sod323
        where:
          ref: matrix_pinky_bottom
          orient: -0
          shift: [10.90, -17.77]
          rotate: 0
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          label: PB
          label_side: -1
      diode_pinky_home:
        what: diode_sod323
        where:
          ref: matrix_pinky_home
          orient: -0
          shift: [-4.35, 26.23]
          rotate: 0
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          label: PH
          label_side: 1
      diode_pinky_lower:
        what: diode_sod323
        where:
          ref: matrix_pinky_lower
          orient: -0
          shift: [-0.10, -9.27]
          rotate: 0
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          label: PL
          label_side: -1
      diode_pinky_top:
        what: diode_sod323
        where:
          ref: matrix_pinky_top
          orient: -0
          shift: [-0.10, 9.23]
          rotate: 0
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          label: PT
          label_side: 1
      diode_ring_bottom:
        what: diode_sod323
        where:
          ref: matrix_ring_bottom
          orient: -0
          shift: [10.90, -22.02]
          rotate: 0
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          label: RB
          label_side: -1
      diode_ring_home:
        what: diode_sod323
        where:
          ref: matrix_ring_home
          orient: -0
          shift: [-13.85, 17.73]
          rotate: 0
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          label: RH
          label_side: 1
      diode_ring_lower:
        what: diode_sod323
        where:
          ref: matrix_ring_lower
          orient: -0
          shift: [1.40, -9.27]
          rotate: 0
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          label: RL
          label_side: -1
      diode_ring_top:
        what: diode_sod323
        where:
          ref: matrix_ring_top
          orient: -0
          shift: [0.90, 9.23]
          rotate: 0
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          label: RT
          label_side: 1
      # <<< diodes
      mcu:
        what: xiao_nrf52840
        where:
          ref: matrix_inner_top
          # USB-C end flush with the board edge so the plug isn't blocked
          shift: [kx + 4, 12.5]
        params:
          NFC1: SDA
          NFC2: SCL
      # trackpad (I2C on the NFC pads, data ready on D10): wire pads just below the XIAO, next to the NFC pads,
      # 4.7k 0805 pull-ups between them and the power switch / controller-column screw
      trackpad:
        what: trackpad_pads
        where:
          ref: matrix_inner_top
          shift: [kx + 4, -0.5]
        params:
          DR: D10
      pullup_sda:
        what: resistor_0805
        where:
          ref: matrix_inner_top
          shift: [kx + 4.8, -5]
        params:
          from: SDA
          to: 3V3
      pullup_scl:
        what: resistor_0805
        where:
          ref: matrix_inner_top
          shift: [kx + 9.2, -5]
        params:
          from: SCL
          to: 3V3
      # Molex Pico-EZmate (1.65 mm mated height) on top, below keycap height; plug faces the bottom edge of the
      # controller column, its courtyard (plug + wire exit) ends at the edge, wires drop into the battery pocket below
      battery:
        what: battery_connector_molex_pico_ezmate_1x02
        where:
          ref: matrix_inner_top
          shift: [kx + 4, -10.95]
        params:
          side: F
          # pads on both sides: solder it on top, or underneath (fits the 2 mm gap under the PCB, 1.65 mm mated)
          # for a thinner case; same cable polarity either way, fit only one
          reversible: true
          BAT_P: BAT_IN
          BAT_N: GND
      # Alps SSSS811101 side-actuated slide switch, lever sticks out past the outer edge of the controller area
      power:
        what: power_switch_smd_side
        where:
          ref: matrix_inner_top
          shift: [kx + 14.9, -6]
        params:
          side: F
          from: BAT_IN
          to: BAT
      # M2 mounting holes (absolute coords = shift from matrix_outer_lower at 0,0), screws from the top into case bosses.
      # mount_*: head outside the keycaps (tabs, thumb gap, controller column)
      # mount_opt_*: optional, between switch housings under the keycaps (needs low head, e.g. M2 wafer/ISO 7380)
      mount_1:
        what: mounting_hole_m2
        where:
          ref: matrix_outer_lower
          shift: [-11, 42.5]
      mount_2:
        what: mounting_hole_m2
        where:
          ref: matrix_outer_lower
          shift: [-11, 8.5]
      mount_3:
        what: mounting_hole_m2
        where:
          ref: matrix_outer_lower
          shift: [9, 61.5]
      mount_4:
        what: mounting_hole_m2
        where:
          ref: matrix_outer_lower
          shift: [9, -10.5]
      mount_5:
        what: mounting_hole_m2
        where:
          ref: matrix_outer_lower
          shift: [65.9, 14.5]
      mount_6:
        what: mounting_hole_m2
        where:
          ref: matrix_outer_lower
          shift: [77.7, 15.2]
      mount_7:
        what: mounting_hole_m2
        where:
          ref: matrix_outer_lower
          shift: [98.0, 12.6]
      mount_8:
        what: mounting_hole_m2
        where:
          ref: matrix_outer_lower
          shift: [105.8, 50.2]
      mount_9:
        what: mounting_hole_m2
        where:
          ref: matrix_outer_lower
          shift: [120.5, 43.5]
      mount_opt_1:
        what: mounting_hole_m2
        where:
          ref: matrix_outer_lower
          shift: [9, 25.5]
      mount_opt_2:
        what: mounting_hole_m2
        where:
          ref: matrix_outer_lower
          shift: [27.8, 17]
      mount_opt_3:
        what: mounting_hole_m2
        where:
          ref: matrix_outer_lower
          shift: [27.8, 51]
      mount_opt_4:
        what: mounting_hole_m2
        where:
          ref: matrix_outer_lower
          shift: [44.1, 34]
      mount_opt_5:
        what: mounting_hole_m2
        where:
          ref: matrix_outer_lower
          shift: [63.8, 51]
      mount_opt_6:
        what: mounting_hole_m2
        where:
          ref: matrix_outer_lower
          shift: [72, 34.4]
      mount_opt_7:
        what: mounting_hole_m2
        where:
          ref: matrix_outer_lower
          shift: [86.7, 48.8]
  right:
    $extends: pcbs.left
    outlines.edge.outline: right
    outlines.route_edge.outline: right_route
    footprints:
      switch.asym: clone
      diode_back.asym: clone
      # >>> diode clones (generated)
      diode_far_cluster.asym: clone
      diode_index_bottom.asym: clone
      diode_index_home.asym: clone
      diode_index_top.asym: clone
      diode_inner_bottom.asym: clone
      diode_inner_home.asym: clone
      diode_inner_top.asym: clone
      diode_mid_cluster.asym: clone
      diode_middle_bottom.asym: clone
      diode_middle_home.asym: clone
      diode_middle_lower.asym: clone
      diode_middle_top.asym: clone
      diode_near_cluster.asym: clone
      diode_outer_bottom.asym: clone
      diode_outer_home.asym: clone
      diode_outer_lower.asym: clone
      diode_outer_top.asym: clone
      diode_pinky_bottom.asym: clone
      diode_pinky_home.asym: clone
      diode_pinky_lower.asym: clone
      diode_pinky_top.asym: clone
      diode_ring_bottom.asym: clone
      diode_ring_home.asym: clone
      diode_ring_lower.asym: clone
      diode_ring_top.asym: clone
      # <<< diode clones
      mcu.asym: clone
      trackpad.asym: clone
      pullup_sda.asym: clone
      pullup_scl.asym: clone
      battery.asym: clone
      mount_1.asym: clone
      mount_2.asym: clone
      mount_3.asym: clone
      mount_4.asym: clone
      mount_5.asym: clone
      mount_6.asym: clone
      mount_7.asym: clone
      mount_8.asym: clone
      mount_9.asym: clone
      mount_opt_1.asym: clone
      mount_opt_2.asym: clone
      mount_opt_3.asym: clone
      mount_opt_4.asym: clone
      mount_opt_5.asym: clone
      mount_opt_6.asym: clone
      mount_opt_7.asym: clone
      power:
        asym: clone
        # mirroring keeps rotation 0, so turn it around to point the lever at the right half's outer edge
        adjust.rotate: 180
